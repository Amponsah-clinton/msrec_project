{# Shared topbar for the Institutional Secretary dashboard. Expects `title` and `subtitle`. #}
      <div class="topbar-title">
        <h1>{{ title }}</h1>
        <p>{{ subtitle }}</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>

        <div class="dropdown" id="profileDropdown">
          <button class="profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            {% if profile_photo_url %}<img src="{{ profile_photo_url }}" alt="">{% else %}<span class="avatar-initials">{{ request.user.initials }}</span>{% endif %}
            <svg viewBox="0 0 24 24" class="chev"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu profile-menu" id="profileMenu">
            <div class="profile-menu-head">
              {% if profile_photo_url %}<img src="{{ profile_photo_url }}" alt="">{% else %}<span class="avatar-initials">{{ request.user.initials }}</span>{% endif %}
              <div>
                <strong>{{ request.user.full_name }}</strong>
                <span>{{ request.user.email }}</span>
              </div>
            </div>
            <a href="{% url 'institution_dashboard:home' %}" class="dropdown-item">
              <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
              Dashboard
            </a>
            <div class="dropdown-divider"></div>
            <a href="{% url 'pages:logout' %}" class="dropdown-item logout">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
              Log Out
            </a>
          </div>
        </div>
      </div>
