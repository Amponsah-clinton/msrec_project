{# Suspend / ban dialog shared by the Admin and Secretariat Accounts pages (see static/dashboard/js/accounts.js). #}
      <div class="acct-modal-overlay" id="acctSuspendOverlay" hidden>
        <div class="acct-modal acct-suspend-modal" role="dialog" aria-modal="true" aria-labelledby="acctSuspendTitle">
          <form method="post" id="acctSuspendForm" data-fit-url="{% url 'admin_dashboard:suspension_letter_fit' %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="suspend">
            <input type="hidden" name="tab" value="{{ active_tab }}">
            <input type="hidden" name="user_id" id="suspendUserId">

            <div class="acct-modal-head">
              <div>
                <h3 id="acctSuspendTitle">Suspend account</h3>
                <p class="acct-suspend-who" id="suspendWho"></p>
              </div>
              <button type="button" class="icon-btn" id="acctSuspendClose" aria-label="Close">
                <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>

            <div class="acct-modal-body">
              <fieldset class="acct-kind">
                <legend>Action</legend>
                <label class="acct-kind-opt">
                  <input type="radio" name="suspension_kind" value="suspend" checked>
                  <span><strong>Suspend</strong><small>Reactivate anytime</small></span>
                </label>
                <label class="acct-kind-opt is-ban">
                  <input type="radio" name="suspension_kind" value="ban">
                  <span><strong>Ban</strong><small>Permanent</small></span>
                </label>
              </fieldset>

              <div class="acct-reason">
                <label for="suspendReason">Reason <span class="acct-optional">optional</span></label>
                <textarea name="reason" id="suspendReason" rows="4" maxlength="1500"
                          placeholder="e.g. Repeated breach of the confidentiality agreement"></textarea>
                <div class="acct-reason-meta">
                  <span class="acct-fit" id="suspendFit" data-state="idle">Blank uses a default line on the letter.</span>
                  <span class="acct-count" id="suspendCount">0 / 1500</span>
                </div>
              </div>

              <div class="acct-until" id="suspendUntilWrap">
                <label for="suspendUntil">Access restored on <span class="acct-optional">optional</span></label>
                <input type="datetime-local" name="suspended_until" id="suspendUntil">
                <p class="acct-until-hint">Blank means indefinite, until reactivated.</p>
              </div>

              <p class="acct-suspend-note">
                <span>Signs them out now and emails the letter to <strong id="suspendEmail"></strong>.</span>
              </p>
            </div>

            <div class="acct-modal-actions">
              <button type="button" class="acct-btn acct-btn-cancel" id="acctSuspendCancel">Cancel</button>
              <button type="submit" class="acct-btn acct-btn-edit" formaction="{% url 'admin_dashboard:suspension_letter_preview' %}" formtarget="_blank" formnovalidate>
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg> Preview letter
              </button>
              <button type="submit" class="acct-btn acct-btn-delete" id="suspendSubmit">Suspend &amp; send letter</button>
            </div>
          </form>
        </div>
      </div>
